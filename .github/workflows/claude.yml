name: Claude Code

# Issue-driven automation: Claude Code reacts to @claude mentions in issues and
# pull requests, and to issue assignments.
#
# Setup required once by a human (no secrets may be committed to files):
#   1. Add repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables
#      → Actions) — or CLAUDE_CODE_OAUTH_TOKEN, and point the action input below
#      at `claude_code_oauth_token` instead.
#   2. Optionally install the Claude Code GitHub App for tighter permissions.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.action == 'assigned'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
